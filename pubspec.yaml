name: fittrack_pro
description: A premium personal fitness tracking app with cloud sync, interactive charts, and goal reminders.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  fl_chart: ^0.69.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4
  share_plus: ^10.1.0
  csv: ^6.0.0
  image_picker: ^1.1.2
  pedometer: ^4.0.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # Inter 4.0 (DESIGN.md), SIL Open Font License: fonts/Inter-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
